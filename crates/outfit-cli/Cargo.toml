[package]
name = "outfit-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "outfit"
path = "src/main.rs"

[dependencies]
outfit-core = { path = "../outfit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
getrandom = "0.3"

[dev-dependencies]
png = "0.18"
