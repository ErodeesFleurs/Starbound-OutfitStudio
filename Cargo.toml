[workspace]
members = ["crates/outfit-core", "crates/outfit-web", "crates/outfit-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
outfit-core = { path = "crates/outfit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.18"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.outfit-web]
opt-level = "s"
