[workspace]
members = ["crates/outfit-core", "crates/outfit-web", "crates/outfit-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
outfit-core = { path = "crates/outfit-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
png = "0.18.1"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
futures = "0.3.34"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.release.package.outfit-web]
opt-level = "s"
